version: '3.8'

services:
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: ksp_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: crimeassist_db
      POSTGRES_USER: crimeassist
      POSTGRES_PASSWORD: your_secure_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7-alpine
    container_name: ksp_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
